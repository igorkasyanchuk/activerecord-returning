name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} (sqlite3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        rails: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 8 requires Ruby 3.2+
          - { ruby: "3.1", rails: "8.0" }
          - { ruby: "3.1", rails: "8.1" }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  postgres:
    name: Ruby 3.4 / Rails ${{ matrix.rails }} (postgresql)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rails: ["7.0", "8.1"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/activerecord_returning_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres activerecord_returning_test
      - run: bundle exec rake test
