name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruby ${{ matrix.ruby }} / ${{ matrix.db }} / rails ${{ matrix.rails }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every supported Rails version runs on SQLite...
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        rails: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        db: [sqlite]
        exclude:
          # Rails 8 requires Ruby 3.2+
          - { ruby: "3.1", rails: "8.0" }
          - { ruby: "3.1", rails: "8.1" }
        include:
          # ...PostgreSQL, the primary target, runs on every one of them...
          # ...and MySQL, which has no RETURNING, runs the UnsupportedAdapter
          # tests on the oldest adapter that exists (trilogy landed in 7.1) and
          # the newest.
          - { ruby: "3.4", rails: "7.0", db: postgres }
          - { ruby: "3.4", rails: "7.1", db: postgres }
          - { ruby: "3.4", rails: "7.2", db: postgres }
          - { ruby: "3.4", rails: "8.0", db: postgres }
          - { ruby: "3.4", rails: "8.1", db: postgres }
          - { ruby: "3.4", rails: "7.1", db: mysql }
          - { ruby: "3.4", rails: "8.1", db: mysql }
          # MariaDB answers supports_insert_returning? with true (it has
          # INSERT ... RETURNING) while having no UPDATE ... RETURNING at all,
          # so it needs its own lane.
          - { ruby: "3.4", rails: "8.1", db: mariadb }

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB: ${{ matrix.db }}
      BUNDLE_GEMFILE: ${{ format('gemfiles/rails_{0}.gemfile', matrix.rails) }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test

      - name: bin/setup and bin/console boot
        if: matrix.db == 'sqlite'
        run: |
          bin/setup
          echo "exit" | bin/console
